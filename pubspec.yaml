name: martian_climate_dashboard
description: "Martian Climate Dashboard is a Flutter application for visualizing Martian climate data, including temperature, pressure, and other atmospheric parameters. The app supports data interpolation, AI insights, and interactive visualizations."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.4.0
  dartssh2: ^2.12.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.6
  build_runner: ^2.4.6
  
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/kml/

